<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{ title }}</title>
    <style>
{% include "style.css" %}
    </style>
  </head>
  <body>
    <header>
      <h1>QSOs for {{ call }}</h1>
      <div>Generated by <a href="https://qsomap.bsdworld.org/">QSO Map generator</a></div>
      <div class="counters">
        <b>{{ count }}</b> contacts from <b>{{ start.strftime("%Y-%m-%d") }}</b> to <b>{{ end.strftime("%Y-%m-%d") }}</b>
      </div>
    </header>
    <main>
      <div class="container">
        {{ map|safe }}
      </div>
    </main>
    <footer class="footer">
      <div class="container">
        <!-- Copyright -->
        <div>
          <div>This map has been build with <a href="https://qrz.com/db/{{ call }}" target="_qrz">{{ call }}</a> adif logfile</div>
          <div>Copyright © 2026 Fred W6BSD <a class="text-white-50" href="https://0x9900.com/">0x9900.com</a></div>
        </div>
      </div>
    </footer>
  </body>
</html>
